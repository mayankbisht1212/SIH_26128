# Supabase CLI project configuration
# Docs: https://supabase.com/docs/guides/cli/config

[project]
# Your Supabase project reference ID (the part before .supabase.co in your URL)
# URL format: https://<project_id>.supabase.co
project_id = "wdshjmiphkkypcohuyeb"

[api]
# Port for the local Supabase API (only used when running `supabase start`)
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Port for the local Postgres database (only used when running `supabase start`)
port = 54322
shadow_port = 54320
major_version = 15

[studio]
# Port for Supabase Studio (local dashboard)
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# Port for local email testing (for auth OTP emails)
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false   # set to true in production

[auth.sms]
enable_signup = false
enable_confirmations = false
